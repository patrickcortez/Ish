[package]
name = "ish"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.45"
comfy-table = "7.2.2"
dotenvy = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[[bin]]
name = "ish"
path = "src/main.rs"

[[bin]]
name = "setfont"
path = "src/bin/setfont.rs"
